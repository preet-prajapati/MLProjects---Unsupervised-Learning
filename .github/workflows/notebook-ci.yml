name: Validate SmartCart project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Validate the dataset
        run: pytest -q tests

      - name: Execute the notebook
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
        run: pytest --nbmake --nbmake-timeout=300 notebooks/smartcart_customer_segmentation.ipynb
